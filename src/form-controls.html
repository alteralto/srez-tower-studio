<section class="group form-controls"><h3>Форма</h3>
<div class="field"><label for="roundness">Скругление контура <output id="roundnessValue"></output></label><input id="roundness" type="range" min="0" max="1" step="0.1"></div>
<div class="field"><label for="twist">Скручивание к вершине <output id="twistValue"></output></label><input id="twist" type="range" min="-150" max="150" step="1"></div>
<div class="field"><label for="helix">Спираль фасада, витков <output id="helixValue"></output></label><input id="helix" type="range" min="0" max="3" step="0.25"></div>
<div class="field"><label for="taper">Сужение кверху <output id="taperValue"></output></label><input id="taper" type="range" min="0" max="0.45" step="0.01"></div>
<div class="field"><label for="rotation">Поворот башни <output id="rotationValue"></output></label><input id="rotation" type="range" min="-180" max="180" step="1"></div>
<div class="field"><label for="leanX">Сдвиг вершины по X <output id="leanXValue"></output></label><input id="leanX" type="range" min="-12" max="12" step="0.3"></div>
<div class="field"><label for="leanY">Сдвиг вершины по Y <output id="leanYValue"></output></label><input id="leanY" type="range" min="-12" max="12" step="0.3"></div>
<div class="field"><label for="steps">Каскадные уступы <output id="stepsValue"></output></label><input id="steps" type="range" min="0" max="6" step="1"></div>
<div class="field"><label for="stepDepth">Глубина уступа <output id="stepDepthValue"></output></label><input id="stepDepth" type="range" min="0" max="1.8" step="0.3"></div>
<div class="field"><label for="upper">Этажей верхнего уступа <output id="upperValue"></output></label><input id="upper" type="range" min="0" max="20" step="1"></div>
<p class="hint">Форма пересчитывается поэтажно. Спираль — рисунок медных простенков, она не меняет площадей. Конструктив и планировки сложных форм требуют разработки</p></section>
